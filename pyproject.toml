[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-platform"
version = "0.1.0"
description = "Multi-tenant model gateway: cost-aware routing checked against quality targets, accurate usage and billing, tenant isolation with row-level security, encrypted customer keys, recoverable agent runs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "litellm>=1.40",
  "httpx>=0.27",
  "cryptography>=42",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "testcontainers[postgres,redis]>=4.4"]

[project.scripts]
mrp = "mrp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrp = ["sql/*.sql", "config/*.yaml", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = ["invariant: a property the platform must never lose (tenant isolation, billing exactness, secrets); required in CI"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
files = ["src/mrp"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
