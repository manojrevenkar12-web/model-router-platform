name: ci
on:
  push:
  pull_request:

jobs:
  check:
    name: lint, types, tests (invariants first)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: mrp_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      MRP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mrp_test
      MRP_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: invariants (tenant isolation, billing exactness, secrets, agent effects)
        run: pytest -m invariant
      - name: everything else
        run: pytest -m "not invariant"

  evaluate:
    name: evaluation and objectives
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: mrp_eval}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      MRP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mrp_eval
      MRP_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]" matplotlib
      - run: mrp evaluate --out out
      - run: mrp gate --out out
      - uses: actions/upload-artifact@v4
        with: {name: evaluation, path: out}

  testcontainers:
    name: tests with testcontainers (no preconfigured services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -m invariant -x

  infra:
    name: terraform and kubernetes checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install checkov
      - run: checkov -d infra --config-file .checkov.yaml --quiet --compact

  container:
    name: container and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke.sh
      - if: always()
        run: docker compose -f deploy/docker-compose.yml logs --tail 60
